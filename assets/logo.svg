<?xml version="1.0" encoding="UTF-8"?>
<!-- Liquid Glass — logo original : une goutte de verre irisée.
     Utilisé par fastfetch (sixel), le menu du logo de la barre et le README. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="600" viewBox="0 0 512 600">
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="0.45" stop-color="#0a84ff"/>
      <stop offset="0.78" stop-color="#7d5cf0"/>
      <stop offset="1" stop-color="#d9539a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ombre douce -->
  <ellipse cx="256" cy="560" rx="150" ry="22" fill="#0a1a40" opacity="0.28" filter="url(#shadow)"/>

  <!-- corps de la goutte -->
  <path id="drop" d="M256 28 C 300 120, 430 250, 430 372 C 430 470, 352 548, 256 548 C 160 548, 82 470, 82 372 C 82 250, 212 120, 256 28 Z"
        fill="url(#body)"/>
  <path d="M256 28 C 300 120, 430 250, 430 372 C 430 470, 352 548, 256 548 C 160 548, 82 470, 82 372 C 82 250, 212 120, 256 28 Z"
        fill="url(#glow)"/>

  <!-- reflet principal (verre) -->
  <path d="M190 210 C 160 260, 140 310, 142 360 C 144 392, 170 398, 180 370 C 192 330, 205 285, 224 240 C 236 212, 206 188, 190 210 Z"
        fill="url(#shine)" opacity="0.9"/>
  <!-- petit éclat -->
  <ellipse cx="318" cy="452" rx="34" ry="16" transform="rotate(-32 318 452)" fill="#ffffff" opacity="0.32"/>

  <!-- liseré lumineux -->
  <path d="M256 28 C 300 120, 430 250, 430 372 C 430 470, 352 548, 256 548 C 160 548, 82 470, 82 372 C 82 250, 212 120, 256 28 Z"
        fill="none" stroke="url(#rim)" stroke-width="5"/>
</svg>

# ============================================================================
#  Liquid Glass — configuration centrale
#  ~/.config/liquid-glass/config.toml
#
#  Modifie ce fichier à la main ou via l'app Réglages, puis :
#      liquid-glass apply          (réapplique tout)
#  Les réglages Spotify/paroles/dock sont relus à chaud par le shell.
#  Raccourci : liquid-glass set <section.clé> <valeur>   ex. glass.blur_size 9
# ============================================================================

[appearance]
# light | dark | auto (bascule selon les heures ci-dessous)
mode = "light"
auto_light_at = "07:30"
auto_dark_at = "19:30"
# Police de l'interface (barre, dock, panneaux Liquid Glass) et police mono.
font_ui = "Inter"
font_mono = "JetBrainsMono Nerd Font"
# Logo de la barre : pomme | arch | tux | omarchy | orb | goutte | custom
# (custom : image SVG/PNG de logo_path, chemin absolu).
logo = "pomme"
logo_path = ""

[glass]
# Style du verre : clear (très transparent) | standard | tinted (teinté, plus opaque).
style = "standard"
# Flou Hyprland : taille et nombre de passes (plus = plus flou, plus coûteux).
blur_size = 7
blur_passes = 3
# Multiplicateur d'opacité des surfaces du shell (barre, menus, notifications).
# 1.0 = défaut ; 0.8 = plus transparent ; 1.2 = plus opaque.
opacity = 1.0
# Opacité des fenêtres d'applications (active, inactive).
window_opacity_active = 0.96
window_opacity_inactive = 0.90
# Arrondi des coins (px) et espacements.
rounding = 16
gaps_in = 5
gaps_out = 10
# Animations à ressort (false = aucune animation).
animations = true

[terminal]
# Opacité du fond des terminaux (foot) en verre.
opacity_light = 0.80
opacity_dark = 0.76

[dock]
# Taille des icônes (px), facteur de grossissement au survol, masquage auto.
icon_size = 42
magnification = 1.6
autohide = false
# Visible sur tous les bureaux (true) ou seulement les bureaux flottants (false).
always_visible = true

[spotify]
# Fond d'écran dynamique : off | cover (pochette nette sur fond flou)
#                          | blur (pochette floutée plein écran) | gradient
wallpaper = "off"
# Retour au fond normal après N minutes de pause (0 = jamais).
restore_after_minutes = 5
# Couleurs dynamiques extraites de la pochette (bordures, barre, dock, terminal).
dynamic_colors = true

[lyrics]
# Paroles synchronisées (LRCLIB). Chaque mode s'active indépendamment.
desktop = false       # en grand sur le bureau, derrière les fenêtres
widget = false        # petit widget flottant déplaçable
bar = true            # ligne actuelle dans la barre du haut
# Le mode karaoké plein écran s'ouvre avec SUPER+ALT+M (⌘⌥M).

[visualizer]
# Visualiseur cava en bas du fond d'écran (coûteux sur iGPU : off par défaut).
enabled = false
bars = 64

[keys]
# Raccourcis façon macOS (⌘Espace Spotlight, ⌘Q quitter, ⌘Tab, ⌘⇧3/4/5…).
# false = garder uniquement les raccourcis Omarchy. Voir README pour la liste.
macos_shortcuts = true
# Son de clavier mécanique sur tout le système (liquid-glass keys on|off|test).
# Passe par Hyprland : aucun groupe « input », rien n'est donné aux applications.
sound = false
sound_pack = "auto"          # auto = le pack choisi dans Mechvibes
sound_volume = 0.6
sound_release = true
sound_mouse = true           # clics de souris aussi

[widgets]
# Widgets du bureau façon macOS (sur le fond d'écran, sous les fenêtres).
enabled = true
# left | right
position = "left"
clock = true
calendar = true
weather = true
# Horloge : digital (chiffres en verre) | analog (cadran) ; météo : wide (avec
# les prochaines heures) | small.
clock_style = "digital"
weather_size = "wide"
battery = true
# Lecture en cours aux couleurs de la pochette (avec la palette cliquable).
music = true
# Ville de la météo ("" = celle du fuseau horaire). Données : Open-Meteo, sans clé.
weather_city = ""
# Masquer les widgets quand la pochette sert de fond d'écran (pas la carte musique).
hide_on_cover = true
# Carte musique libre : glisser-la n'importe où (elle glisse avec de l'inertie
# et rebondit sur les bords), survol → pastille S · M · L pour la taille,
# bulle → paroles dans la carte.
# Position de départ tant qu'elle n'a pas été déplacée :
#   top-left | top-center | top-right | middle-left | center | middle-right
#   | bottom-left | bottom-center | bottom-right
music_position = "bottom-left"
# Position libre (fractions de l'écran ; -1 = d'après music_position).
music_x = -1
music_y = -1
# small (pochette + titre) | medium (+ progression, commandes) | large (grande pochette)
music_size = "medium"

[lock]
# Écran de verrouillage façon macOS Tahoe (relu à chaud).
# Sur le bureau Linux : écran « bonbon » (horloge empilée, bascule clair/sombre).
# auto = selon le profil actif | on = toujours | off = jamais
linux_style = "auto"
# Horloge : glass (verre dégradé) | bold | light ; 24 h ou 12 h.
clock_style = "glass"
clock_24h = true
# Police de l'horloge ("" = police de l'interface).
clock_font = ""
# Notifications récentes en haut à droite :
# full (titre + texte) | summary (appli + titre) | count (nombre) | off
notifications = "summary"
# Widget musique au-dessus de l'avatar. Sa bulle l'agrandit : grande pochette,
# paroles à côté, et le fond devient : art / blur (pochette floutée)
# | wallpaper (fond Spotify) | off (fond normal).
music_background = "art"
music_card = true     # widget « lecture en cours »
lyrics = true         # paroles synchronisées quand le widget est agrandi
# Position libre du widget (fractions de l'écran, -1 = au-dessus de l'avatar).
# Glisser le widget l'enregistre ; double-clic = retour à la place par défaut.
music_x = -1
music_y = -1
wallpaper_blur = false  # fond d'écran flouté (false = net, comme macOS)
status = true         # batterie en haut à droite

[control]
# Boutons ronds du Centre de contrôle, dans l'ordre (4 par ligne).
# Disponibles : nightshift awake screenshot record glass lyrics karaoke mission
#               desktop lock calculator clipboard emoji settings
buttons = ["nightshift", "awake", "screenshot", "record", "glass", "lyrics", "mission", "settings"]

[hotcorners]
# Coins actifs : pointer dans un coin de l'écran déclenche une action.
# Actions : mission | desktop | spotlight | control | karaoke | lock | settings | "" (rien)
# Les coins du haut sont libres par défaut (la barre et le logo y sont).
top_left = ""
top_right = ""
bottom_left = "mission"
bottom_right = "desktop"

[island]
# Île dynamique façon Alcove : capsule noire en haut au centre (fausse encoche).
enabled = true
# Au repos : hidden (n'apparaît qu'avec une activité) | notch (petite encoche noire).
idle = "hidden"
music = true          # Lecture en cours : pochette + égaliseur, clic = commandes
battery = true        # Branchement / débranchement du secteur
bluetooth = true      # Casque ou appareil Bluetooth connecté (avec sa batterie)
focus = true          # Changement de mode Concentration
hud = false           # Volume dans l'île (l'OSD Liquid Glass le montre déjà)

[corners]
# Coins d'écran arrondis façon MacBook (surcouche noire, les clics passent au travers)
enabled = true
radius = 10

[menubar]
# Horloge de la barre et calendrier (Réglages → Barre des menus)
clock_24h = true
show_date = true
show_seconds = false
week_monday = true

[shortcuts]
# Raccourcis d'apps dans la barre des menus (Réglages → Raccourcis).
# « claude-code » = Claude Code (omarchy-agent) ; sinon l'id .desktop d'une app.
apps = ["claude-code"]

[windows]
# Fenêtres flottantes comme sur Mac (ouvertes au centre, barre de titre à feux tricolores)
floating = true
# Bouton vert : "menu" (Plein écran, moitiés, quarts… comme Tahoe) ou "zoom" (agrandir)
green_button = "menu"

[profile]
# Bureau actif : "mac" (Liquid Glass) ou "linux" (rice lain, d'après les dotfiles
# Teiguuu). ⌘⇧Espace ou `liquid-glass profile toggle` pour basculer.
active = "mac"

[linux]
# Bureau Linux (⌘⇧Espace ouvre le sélecteur de styles). style :
#   blanc      barre de texte en bas (dwm), bords durs, ombres décalées (défaut)
#   sombre     mur de tuiles, mot chanté géant (sombre_tone ; sombre_wall = false rend l'ancien bureau)
#   jouet      gros dock en bas, pas de barre en haut, autocollants
#   violet     montagnes dans la brume, grosse horloge « bonbon » (violet_tone : nuit | aube | rose)
#   expressive Material 3 façon end4-pC / Serpantinum (couleurs matugen du fond)
#   windows    clone de Windows 11 : barre des tâches, Démarrer, Paramètres (windows_tone)
#   mono       caelestia : cadre, barre latérale, tableau de bord (mono_tone : noir | papier | sakura)
#   foret      rice c01 : puces flottantes, météo en orbite, spectre (foret_tone)
#   ruban      bandes en biais, grande date, menu oblique (ruban_tone : bleu | rouge | or)
#   espace     paroles au centre, horloge à planètes, tableau de bord (espace_tone : bleu | mars | nebuleuse)
#   gouts      « Mes goûts » : horloge empilée, planètes, paroles, aux couleurs d'un thème Omarchy (gouts_theme)
#   debian fedora mint kali arch   panneau et menu de GNOME, Cinnamon, Xfce ou Plasma
# Une teinte = mêmes widgets, autres couleurs : ⌃⌘T ou touche T dans ⌘⇧Espace.
# Profils : `liquid-glass profile mac | linux | omarchy` (Omarchy d'origine, sans retouche).
style = "blanc"
blanc_tone = "pur"        # pur | creme
violet_tone = "nuit"      # nuit | aube | rose
windows_tone = "clair"    # clair | sombre
foret_tone = "mousse"     # mousse | cendre
# Variante matugen : tonal-spot, expressive, vibrant, fruit-salad, rainbow, monochrome…
scheme = "tonal-spot"
# Widgets du bureau expressive (à glisser ; linux-layout.json garde leur place)
widgets = true
workspaces = 7
# Style lain : horloge pixel. Les deux : bande cava, paroles
clock = true
cava = true
cava_bars = 110
lyrics = true
# Musique (laisser commenté = valeur du style ; Réglages → Bureau Linux → Musique)
# viz = "bars"            # bars | wave | mirror | blocks | line | radial | off
# viz_height = 140        # hauteur du visualiseur (px)
# viz_gain = 1.0          # sensibilité (0.3 – 3)
# viz_opacity = 0.9
# viz_color = "auto"      # auto | cover (couleur de la pochette) | rainbow | ink
# lyrics_mode = "word"    # word (mot géant) | line | card (dans le lecteur) | off
# lyrics_pos = "center"   # center | left | top
# lyrics_size = 1.0
# pulse = true            # halo qui respire avec les basses
# bump = true             # horloges et lecteur qui sautent sur les basses
# cover_tint = false      # accents à la couleur de la pochette
# Widgets (true/false) : w_music, w_weather, w_system, w_todo, w_pixclock, w_day,
# w_stack, w_ring, w_clock, w_user, w_week ; day_kanji (sombre) ; stack_size (violet)

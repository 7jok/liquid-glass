# Liquid Glass — thème « arch — Plasma, bleu Arch » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#1b1e20"
background-alpha = 0.98
text             = "#f2f2f2"
active           = "#1793d1"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(1793d1ee)"
active-border-foreground = "rgba(1793d1ee)"

[controls]
normal-color        = "#f2f2f2"
normal-fill-alpha   = 0.05
normal-border       = "#f2f2f2"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#f2f2f2"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#f2f2f2"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#1793d1"
focus-fill-alpha   = 0.12
focus-border       = "#1793d1"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#1793d1"
selected-fill-alpha   = 0.88
selected-border       = "#1793d1"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#1b1e20"
background-alpha = 0.98
text             = "#f2f2f2"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#1b1e20"
background-alpha = 0.98
text             = "#f2f2f2"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1b1e20"
background-alpha = 0.98
text             = "#f2f2f2"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#1793d1"

[launcher]
background                = "#1b1e20"
background-alpha          = 0.97
text                      = "#f2f2f2"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1b1e20"
scrim-alpha               = 0.12
selected-background       = "#1793d1"
selected-background-alpha = 0.88
selected-text             = "#1b1e20"
selected-border           = "#1793d1"
selected-border-alpha     = 0.0

[menu]
background                = "#1b1e20"
background-alpha          = 0.97
text                      = "#f2f2f2"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1b1e20"
scrim-alpha               = 0.12
selected-background       = "#1793d1"
selected-background-alpha = 0.88
selected-text             = "#1b1e20"
selected-border           = "#1793d1"
selected-border-alpha     = 0.0

[polkit]
background       = "#1b1e20"
background-alpha = 0.94
text             = "#f2f2f2"
text-error       = "#ff7b86"
border           = "hyprland.active-border"
border-error     = "#ff7b86"
border-alpha     = 1.0
scrim            = "#1b1e20"
scrim-alpha      = 0.25
accent           = "#1793d1"

[lock]
background       = "#1b1e20"
background-alpha = 0.80
text             = "#f2f2f2"
placeholder      = "#b8b8b8"
text-error       = "#ff7b86"
border           = "rgba(1793d1ee)"
border-active    = "#1793d1"
border-error     = "#ff7b86"
border-alpha     = 1.0
selection        = "#1793d1"
selection-alpha  = 0.45

[image-picker]
text                    = "#f2f2f2"
selected-border         = "#1793d1"
selected-border-alpha   = 1.0
unselected-border       = "#f2f2f2"
unselected-border-alpha = 0.28

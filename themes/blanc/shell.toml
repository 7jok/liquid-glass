# Liquid Glass — thème « blanc — tout en blanc, encre noire, police mono » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#f7f7f7"
background-alpha = 0.96
text             = "#141414"
active           = "#141414"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(141414ee)"
active-border-foreground = "rgba(141414ee)"

[controls]
normal-color        = "#141414"
normal-fill-alpha   = 0.05
normal-border       = "#141414"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#141414"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#141414"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#141414"
focus-fill-alpha   = 0.12
focus-border       = "#141414"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#141414"
selected-fill-alpha   = 0.88
selected-border       = "#141414"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#f7f7f7"
background-alpha = 0.98
text             = "#141414"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#f7f7f7"
background-alpha = 0.98
text             = "#141414"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#f7f7f7"
background-alpha = 0.98
text             = "#141414"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#141414"

[launcher]
background                = "#f7f7f7"
background-alpha          = 0.97
text                      = "#141414"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#f7f7f7"
scrim-alpha               = 0.12
selected-background       = "#141414"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#141414"
selected-border-alpha     = 0.0

[menu]
background                = "#f7f7f7"
background-alpha          = 0.97
text                      = "#141414"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#f7f7f7"
scrim-alpha               = 0.12
selected-background       = "#141414"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#141414"
selected-border-alpha     = 0.0

[polkit]
background       = "#f7f7f7"
background-alpha = 0.94
text             = "#141414"
text-error       = "#d32f2f"
border           = "hyprland.active-border"
border-error     = "#d32f2f"
border-alpha     = 1.0
scrim            = "#f7f7f7"
scrim-alpha      = 0.25
accent           = "#141414"

[lock]
background       = "#f7f7f7"
background-alpha = 0.80
text             = "#141414"
placeholder      = "#6e6e6e"
text-error       = "#d32f2f"
border           = "rgba(141414ee)"
border-active    = "#141414"
border-error     = "#d32f2f"
border-alpha     = 1.0
selection        = "#141414"
selection-alpha  = 0.45

[image-picker]
text                    = "#141414"
selected-border         = "#141414"
selected-border-alpha   = 1.0
unselected-border       = "#141414"
unselected-border-alpha = 0.28

# Liquid Glass — thème « forêt — olive, tilleul et pêche (c01) » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#1a1d14"
background-alpha = 0.92
text             = "#e6e9d6"
active           = "#cfe89a"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(cfe89aee)"
active-border-foreground = "rgba(cfe89aee)"

[controls]
normal-color        = "#e6e9d6"
normal-fill-alpha   = 0.05
normal-border       = "#e6e9d6"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#e6e9d6"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#e6e9d6"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#cfe89a"
focus-fill-alpha   = 0.12
focus-border       = "#cfe89a"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#cfe89a"
selected-fill-alpha   = 0.88
selected-border       = "#cfe89a"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#1a1d14"
background-alpha = 0.95
text             = "#e6e9d6"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#1a1d14"
background-alpha = 0.95
text             = "#e6e9d6"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1a1d14"
background-alpha = 0.95
text             = "#e6e9d6"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#cfe89a"

[launcher]
background                = "#1a1d14"
background-alpha          = 0.97
text                      = "#e6e9d6"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1a1d14"
scrim-alpha               = 0.12
selected-background       = "#cfe89a"
selected-background-alpha = 0.88
selected-text             = "#1a1d14"
selected-border           = "#cfe89a"
selected-border-alpha     = 0.0

[menu]
background                = "#1a1d14"
background-alpha          = 0.97
text                      = "#e6e9d6"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1a1d14"
scrim-alpha               = 0.12
selected-background       = "#cfe89a"
selected-background-alpha = 0.88
selected-text             = "#1a1d14"
selected-border           = "#cfe89a"
selected-border-alpha     = 0.0

[polkit]
background       = "#1a1d14"
background-alpha = 0.94
text             = "#e6e9d6"
text-error       = "#ffbab4"
border           = "hyprland.active-border"
border-error     = "#ffbab4"
border-alpha     = 1.0
scrim            = "#1a1d14"
scrim-alpha      = 0.25
accent           = "#cfe89a"

[lock]
background       = "#1a1d14"
background-alpha = 0.80
text             = "#e6e9d6"
placeholder      = "#b9bea4"
text-error       = "#ffbab4"
border           = "rgba(cfe89aee)"
border-active    = "#cfe89a"
border-error     = "#ffbab4"
border-alpha     = 1.0
selection        = "#cfe89a"
selection-alpha  = 0.45

[image-picker]
text                    = "#e6e9d6"
selected-border         = "#cfe89a"
selected-border-alpha   = 1.0
unselected-border       = "#e6e9d6"
unselected-border-alpha = 0.28

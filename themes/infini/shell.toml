# Liquid Glass — thème « infini — cerisiers la nuit, verre fumé rose (bureau infini) » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#1c1718"
background-alpha = 0.4
text             = "#ece2e4"
active           = "#e8a3b4"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(e8a3b4aa)"
active-border-foreground = "rgba(e8a3b4aa)"

[controls]
normal-color        = "#ece2e4"
normal-fill-alpha   = 0.05
normal-border       = "#ece2e4"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#ece2e4"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#ece2e4"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#e8a3b4"
focus-fill-alpha   = 0.12
focus-border       = "#e8a3b4"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#e8a3b4"
selected-fill-alpha   = 0.88
selected-border       = "#e8a3b4"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#1c1718"
background-alpha = 0.92
text             = "#ece2e4"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#1c1718"
background-alpha = 0.92
text             = "#ece2e4"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1c1718"
background-alpha = 0.92
text             = "#ece2e4"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#e8a3b4"

[launcher]
background                = "#1c1718"
background-alpha          = 0.97
text                      = "#ece2e4"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1c1718"
scrim-alpha               = 0.12
selected-background       = "#e8a3b4"
selected-background-alpha = 0.88
selected-text             = "#1c1718"
selected-border           = "#e8a3b4"
selected-border-alpha     = 0.0

[menu]
background                = "#1c1718"
background-alpha          = 0.97
text                      = "#ece2e4"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1c1718"
scrim-alpha               = 0.12
selected-background       = "#e8a3b4"
selected-background-alpha = 0.88
selected-text             = "#1c1718"
selected-border           = "#e8a3b4"
selected-border-alpha     = 0.0

[polkit]
background       = "#1c1718"
background-alpha = 0.94
text             = "#ece2e4"
text-error       = "#f0a2ab"
border           = "hyprland.active-border"
border-error     = "#f0a2ab"
border-alpha     = 1.0
scrim            = "#1c1718"
scrim-alpha      = 0.25
accent           = "#e8a3b4"

[lock]
background       = "#1c1718"
background-alpha = 0.80
text             = "#ece2e4"
placeholder      = "#a8999c"
text-error       = "#f0a2ab"
border           = "rgba(e8a3b4aa)"
border-active    = "#e8a3b4"
border-error     = "#f0a2ab"
border-alpha     = 1.0
selection        = "#e8a3b4"
selection-alpha  = 0.45

[image-picker]
text                    = "#ece2e4"
selected-border         = "#e8a3b4"
selected-border-alpha   = 1.0
unselected-border       = "#ece2e4"
unselected-border-alpha = 0.28

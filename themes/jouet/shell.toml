# Liquid Glass — thème « jouet — bonbon, contours épais, ombres dures » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#fff8ee"
background-alpha = 0.97
text             = "#1b1030"
active           = "#ff5fa2"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(ff5fa2ff)"
active-border-foreground = "rgba(ff5fa2ff)"

[controls]
normal-color        = "#1b1030"
normal-fill-alpha   = 0.05
normal-border       = "#1b1030"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#1b1030"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#1b1030"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#ff5fa2"
focus-fill-alpha   = 0.12
focus-border       = "#ff5fa2"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#ff5fa2"
selected-fill-alpha   = 0.88
selected-border       = "#ff5fa2"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#fff8ee"
background-alpha = 0.98
text             = "#1b1030"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#fff8ee"
background-alpha = 0.98
text             = "#1b1030"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#fff8ee"
background-alpha = 0.98
text             = "#1b1030"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#ff5fa2"

[launcher]
background                = "#fff8ee"
background-alpha          = 0.97
text                      = "#1b1030"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#fff8ee"
scrim-alpha               = 0.12
selected-background       = "#ff5fa2"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#ff5fa2"
selected-border-alpha     = 0.0

[menu]
background                = "#fff8ee"
background-alpha          = 0.97
text                      = "#1b1030"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#fff8ee"
scrim-alpha               = 0.12
selected-background       = "#ff5fa2"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#ff5fa2"
selected-border-alpha     = 0.0

[polkit]
background       = "#fff8ee"
background-alpha = 0.94
text             = "#1b1030"
text-error       = "#ff5fa2"
border           = "hyprland.active-border"
border-error     = "#ff5fa2"
border-alpha     = 1.0
scrim            = "#fff8ee"
scrim-alpha      = 0.25
accent           = "#ff5fa2"

[lock]
background       = "#fff8ee"
background-alpha = 0.80
text             = "#1b1030"
placeholder      = "#5b4a7a"
text-error       = "#ff5fa2"
border           = "rgba(ff5fa2ff)"
border-active    = "#ff5fa2"
border-error     = "#ff5fa2"
border-alpha     = 1.0
selection        = "#ff5fa2"
selection-alpha  = 0.45

[image-picker]
text                    = "#1b1030"
selected-border         = "#ff5fa2"
selected-border-alpha   = 1.0
unselected-border       = "#1b1030"
unselected-border-alpha = 0.28

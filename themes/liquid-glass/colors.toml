# Liquid Glass — clair.
# Palette proche des couleurs système de macOS (mode clair). Les teintes des
# terminaux sont plus foncées dans foot.ini pour rester lisibles sur verre blanc.
mode = "light"

accent = "#007aff"
selection = "#b4d5fe"
muted = "#8e8e93"

background = "#f5f5f7"
dark_background = "#ececf0"
darker_background = "#e2e2e7"
lighter_background = "#ffffff"

foreground = "#1d1d1f"
dark_foreground = "#6e6e73"
light_foreground = "#3a3a3c"
bright_foreground = "#000000"

red = "#ff3b30"
yellow = "#ffcc00"
orange = "#ff9500"
green = "#34c759"
cyan = "#32ade6"
blue = "#007aff"
magenta = "#af52de"
brown = "#a2845e"

bright_red = "#ff6961"
bright_yellow = "#ffd60a"
bright_green = "#30d158"
bright_cyan = "#64d2ff"
bright_blue = "#409cff"
bright_magenta = "#da8fff"

# Bordure fine translucide, blanche (~25 % actif, ~12 % inactif).
hyprland_active_border = "rgba(ffffff40)"
hyprland_inactive_border = "rgba(ffffff1f)"

# Liquid Glass — thème « mono papier — blanc pur, encre noire (caelestia blanc) » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#ffffff"
background-alpha = 0.97
text             = "#161616"
active           = "#1a1a1a"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(1a1a1aaa)"
active-border-foreground = "rgba(1a1a1aaa)"

[controls]
normal-color        = "#161616"
normal-fill-alpha   = 0.05
normal-border       = "#161616"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#161616"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#161616"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#1a1a1a"
focus-fill-alpha   = 0.12
focus-border       = "#1a1a1a"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#1a1a1a"
selected-fill-alpha   = 0.88
selected-border       = "#1a1a1a"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#ffffff"
background-alpha = 0.98
text             = "#161616"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#ffffff"
background-alpha = 0.98
text             = "#161616"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#ffffff"
background-alpha = 0.98
text             = "#161616"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#1a1a1a"

[launcher]
background                = "#ffffff"
background-alpha          = 0.97
text                      = "#161616"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#ffffff"
scrim-alpha               = 0.12
selected-background       = "#1a1a1a"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#1a1a1a"
selected-border-alpha     = 0.0

[menu]
background                = "#ffffff"
background-alpha          = 0.97
text                      = "#161616"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#ffffff"
scrim-alpha               = 0.12
selected-background       = "#1a1a1a"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#1a1a1a"
selected-border-alpha     = 0.0

[polkit]
background       = "#ffffff"
background-alpha = 0.94
text             = "#161616"
text-error       = "#d45a6a"
border           = "hyprland.active-border"
border-error     = "#d45a6a"
border-alpha     = 1.0
scrim            = "#ffffff"
scrim-alpha      = 0.25
accent           = "#1a1a1a"

[lock]
background       = "#ffffff"
background-alpha = 0.80
text             = "#161616"
placeholder      = "#6a6a6a"
text-error       = "#d45a6a"
border           = "rgba(1a1a1aaa)"
border-active    = "#1a1a1a"
border-error     = "#d45a6a"
border-alpha     = 1.0
selection        = "#1a1a1a"
selection-alpha  = 0.45

[image-picker]
text                    = "#161616"
selected-border         = "#1a1a1a"
selected-border-alpha   = 1.0
unselected-border       = "#161616"
unselected-border-alpha = 0.28

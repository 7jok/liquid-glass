# Liquid Glass — thème « mono sakura — rose pâle, encre bordeaux (caelestia, arch.inix) » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#fdf1f3"
background-alpha = 0.96
text             = "#5a2a38"
active           = "#7a3d4f"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(7a3d4fcc)"
active-border-foreground = "rgba(7a3d4fcc)"

[controls]
normal-color        = "#5a2a38"
normal-fill-alpha   = 0.05
normal-border       = "#5a2a38"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#5a2a38"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#5a2a38"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#7a3d4f"
focus-fill-alpha   = 0.12
focus-border       = "#7a3d4f"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#7a3d4f"
selected-fill-alpha   = 0.88
selected-border       = "#7a3d4f"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#fdf1f3"
background-alpha = 0.98
text             = "#5a2a38"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#fdf1f3"
background-alpha = 0.98
text             = "#5a2a38"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#fdf1f3"
background-alpha = 0.98
text             = "#5a2a38"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#7a3d4f"

[launcher]
background                = "#fdf1f3"
background-alpha          = 0.97
text                      = "#5a2a38"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#fdf1f3"
scrim-alpha               = 0.12
selected-background       = "#7a3d4f"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#7a3d4f"
selected-border-alpha     = 0.0

[menu]
background                = "#fdf1f3"
background-alpha          = 0.97
text                      = "#5a2a38"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#fdf1f3"
scrim-alpha               = 0.12
selected-background       = "#7a3d4f"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#7a3d4f"
selected-border-alpha     = 0.0

[polkit]
background       = "#fdf1f3"
background-alpha = 0.94
text             = "#5a2a38"
text-error       = "#e2708f"
border           = "hyprland.active-border"
border-error     = "#e2708f"
border-alpha     = 1.0
scrim            = "#fdf1f3"
scrim-alpha      = 0.25
accent           = "#7a3d4f"

[lock]
background       = "#fdf1f3"
background-alpha = 0.80
text             = "#5a2a38"
placeholder      = "#9b6f7c"
text-error       = "#e2708f"
border           = "rgba(7a3d4fcc)"
border-active    = "#7a3d4f"
border-error     = "#e2708f"
border-alpha     = 1.0
selection        = "#7a3d4f"
selection-alpha  = 0.45

[image-picker]
text                    = "#5a2a38"
selected-border         = "#7a3d4f"
selected-border-alpha   = 1.0
unselected-border       = "#5a2a38"
unselected-border-alpha = 0.28

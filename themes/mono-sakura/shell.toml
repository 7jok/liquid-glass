# Liquid Glass — thème « mono sakura — prune profond, rose cerisier » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#1d1218"
background-alpha = 0.94
text             = "#fbe6ee"
active           = "#f7a8c4"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(f7a8c4cc)"
active-border-foreground = "rgba(f7a8c4cc)"

[controls]
normal-color        = "#fbe6ee"
normal-fill-alpha   = 0.05
normal-border       = "#fbe6ee"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#fbe6ee"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#fbe6ee"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#f7a8c4"
focus-fill-alpha   = 0.12
focus-border       = "#f7a8c4"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#f7a8c4"
selected-fill-alpha   = 0.88
selected-border       = "#f7a8c4"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#1d1218"
background-alpha = 0.96
text             = "#fbe6ee"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#1d1218"
background-alpha = 0.96
text             = "#fbe6ee"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1d1218"
background-alpha = 0.96
text             = "#fbe6ee"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#f7a8c4"

[launcher]
background                = "#1d1218"
background-alpha          = 0.97
text                      = "#fbe6ee"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1d1218"
scrim-alpha               = 0.12
selected-background       = "#f7a8c4"
selected-background-alpha = 0.88
selected-text             = "#1d1218"
selected-border           = "#f7a8c4"
selected-border-alpha     = 0.0

[menu]
background                = "#1d1218"
background-alpha          = 0.97
text                      = "#fbe6ee"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1d1218"
scrim-alpha               = 0.12
selected-background       = "#f7a8c4"
selected-background-alpha = 0.88
selected-text             = "#1d1218"
selected-border           = "#f7a8c4"
selected-border-alpha     = 0.0

[polkit]
background       = "#1d1218"
background-alpha = 0.94
text             = "#fbe6ee"
text-error       = "#ffa3b1"
border           = "hyprland.active-border"
border-error     = "#ffa3b1"
border-alpha     = 1.0
scrim            = "#1d1218"
scrim-alpha      = 0.25
accent           = "#f7a8c4"

[lock]
background       = "#1d1218"
background-alpha = 0.80
text             = "#fbe6ee"
placeholder      = "#c9a3b3"
text-error       = "#ffa3b1"
border           = "rgba(f7a8c4cc)"
border-active    = "#f7a8c4"
border-error     = "#ffa3b1"
border-alpha     = 1.0
selection        = "#f7a8c4"
selection-alpha  = 0.45

[image-picker]
text                    = "#fbe6ee"
selected-border         = "#f7a8c4"
selected-border-alpha   = 1.0
unselected-border       = "#fbe6ee"
unselected-border-alpha = 0.28

# Liquid Glass — thème « rubans — bleu nuit, cyan, aplats en biais » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#06102e"
background-alpha = 0.96
text             = "#ffffff"
active           = "#19d3ff"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(19d3ffff)"
active-border-foreground = "rgba(19d3ffff)"

[controls]
normal-color        = "#ffffff"
normal-fill-alpha   = 0.05
normal-border       = "#ffffff"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#ffffff"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#ffffff"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#19d3ff"
focus-fill-alpha   = 0.12
focus-border       = "#19d3ff"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#19d3ff"
selected-fill-alpha   = 0.88
selected-border       = "#19d3ff"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#06102e"
background-alpha = 0.98
text             = "#ffffff"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#06102e"
background-alpha = 0.98
text             = "#ffffff"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#06102e"
background-alpha = 0.98
text             = "#ffffff"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#19d3ff"

[launcher]
background                = "#06102e"
background-alpha          = 0.97
text                      = "#ffffff"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#06102e"
scrim-alpha               = 0.12
selected-background       = "#19d3ff"
selected-background-alpha = 0.88
selected-text             = "#06102e"
selected-border           = "#19d3ff"
selected-border-alpha     = 0.0

[menu]
background                = "#06102e"
background-alpha          = 0.97
text                      = "#ffffff"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#06102e"
scrim-alpha               = 0.12
selected-background       = "#19d3ff"
selected-background-alpha = 0.88
selected-text             = "#06102e"
selected-border           = "#19d3ff"
selected-border-alpha     = 0.0

[polkit]
background       = "#06102e"
background-alpha = 0.94
text             = "#ffffff"
text-error       = "#ff8a9a"
border           = "hyprland.active-border"
border-error     = "#ff8a9a"
border-alpha     = 1.0
scrim            = "#06102e"
scrim-alpha      = 0.25
accent           = "#19d3ff"

[lock]
background       = "#06102e"
background-alpha = 0.80
text             = "#ffffff"
placeholder      = "#a8dfff"
text-error       = "#ff8a9a"
border           = "rgba(19d3ffff)"
border-active    = "#19d3ff"
border-error     = "#ff8a9a"
border-alpha     = 1.0
selection        = "#19d3ff"
selection-alpha  = 0.45

[image-picker]
text                    = "#ffffff"
selected-border         = "#19d3ff"
selected-border-alpha   = 1.0
unselected-border       = "#ffffff"
unselected-border-alpha = 0.28

# Liquid Glass — thème « été — corail, lilas et soleil » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#fff4ec"
background-alpha = 0.9
text             = "#40213a"
active           = "#e2626f"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(e2626fff)"
active-border-foreground = "rgba(e2626fff)"

[controls]
normal-color        = "#40213a"
normal-fill-alpha   = 0.05
normal-border       = "#40213a"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#40213a"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#40213a"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#e2626f"
focus-fill-alpha   = 0.12
focus-border       = "#e2626f"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#e2626f"
selected-fill-alpha   = 0.88
selected-border       = "#e2626f"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#fff4ec"
background-alpha = 0.96
text             = "#40213a"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#fff4ec"
background-alpha = 0.96
text             = "#40213a"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#fff4ec"
background-alpha = 0.96
text             = "#40213a"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#e2626f"

[launcher]
background                = "#fff4ec"
background-alpha          = 0.97
text                      = "#40213a"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#fff4ec"
scrim-alpha               = 0.12
selected-background       = "#e2626f"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#e2626f"
selected-border-alpha     = 0.0

[menu]
background                = "#fff4ec"
background-alpha          = 0.97
text                      = "#40213a"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#fff4ec"
scrim-alpha               = 0.12
selected-background       = "#e2626f"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#e2626f"
selected-border-alpha     = 0.0

[polkit]
background       = "#fff4ec"
background-alpha = 0.94
text             = "#40213a"
text-error       = "#e8566a"
border           = "hyprland.active-border"
border-error     = "#e8566a"
border-alpha     = 1.0
scrim            = "#fff4ec"
scrim-alpha      = 0.25
accent           = "#e2626f"

[lock]
background       = "#fff4ec"
background-alpha = 0.80
text             = "#40213a"
placeholder      = "#85566e"
text-error       = "#e8566a"
border           = "rgba(e2626fff)"
border-active    = "#e2626f"
border-error     = "#e8566a"
border-alpha     = 1.0
selection        = "#e2626f"
selection-alpha  = 0.45

[image-picker]
text                    = "#40213a"
selected-border         = "#e2626f"
selected-border-alpha   = 1.0
unselected-border       = "#40213a"
unselected-border-alpha = 0.28

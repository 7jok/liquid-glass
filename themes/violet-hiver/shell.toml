# Liquid Glass — thème « hiver — neige, glace et lilas » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#f2f5fb"
background-alpha = 0.9
text             = "#1f2a44"
active           = "#5f7fd0"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(2c3a5eff)"
active-border-foreground = "rgba(2c3a5eff)"

[controls]
normal-color        = "#1f2a44"
normal-fill-alpha   = 0.05
normal-border       = "#1f2a44"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#1f2a44"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#1f2a44"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#5f7fd0"
focus-fill-alpha   = 0.12
focus-border       = "#5f7fd0"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#5f7fd0"
selected-fill-alpha   = 0.88
selected-border       = "#5f7fd0"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#f2f5fb"
background-alpha = 0.96
text             = "#1f2a44"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#f2f5fb"
background-alpha = 0.96
text             = "#1f2a44"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#f2f5fb"
background-alpha = 0.96
text             = "#1f2a44"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#5f7fd0"

[launcher]
background                = "#f2f5fb"
background-alpha          = 0.97
text                      = "#1f2a44"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#f2f5fb"
scrim-alpha               = 0.12
selected-background       = "#5f7fd0"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#5f7fd0"
selected-border-alpha     = 0.0

[menu]
background                = "#f2f5fb"
background-alpha          = 0.97
text                      = "#1f2a44"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#f2f5fb"
scrim-alpha               = 0.12
selected-background       = "#5f7fd0"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#5f7fd0"
selected-border-alpha     = 0.0

[polkit]
background       = "#f2f5fb"
background-alpha = 0.94
text             = "#1f2a44"
text-error       = "#d85670"
border           = "hyprland.active-border"
border-error     = "#d85670"
border-alpha     = 1.0
scrim            = "#f2f5fb"
scrim-alpha      = 0.25
accent           = "#5f7fd0"

[lock]
background       = "#f2f5fb"
background-alpha = 0.80
text             = "#1f2a44"
placeholder      = "#5a6788"
text-error       = "#d85670"
border           = "rgba(2c3a5eff)"
border-active    = "#5f7fd0"
border-error     = "#d85670"
border-alpha     = 1.0
selection        = "#5f7fd0"
selection-alpha  = 0.45

[image-picker]
text                    = "#1f2a44"
selected-border         = "#5f7fd0"
selected-border-alpha   = 1.0
unselected-border       = "#1f2a44"
unselected-border-alpha = 0.28

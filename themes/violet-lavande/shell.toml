# Liquid Glass — thème « violet lavande — gris lilas doux » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#f3f1f8"
background-alpha = 0.9
text             = "#2e2840"
active           = "#7b6fb0"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(3d3554ff)"
active-border-foreground = "rgba(3d3554ff)"

[controls]
normal-color        = "#2e2840"
normal-fill-alpha   = 0.05
normal-border       = "#2e2840"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#2e2840"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#2e2840"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#7b6fb0"
focus-fill-alpha   = 0.12
focus-border       = "#7b6fb0"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#7b6fb0"
selected-fill-alpha   = 0.88
selected-border       = "#7b6fb0"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#f3f1f8"
background-alpha = 0.96
text             = "#2e2840"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#f3f1f8"
background-alpha = 0.96
text             = "#2e2840"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#f3f1f8"
background-alpha = 0.96
text             = "#2e2840"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#7b6fb0"

[launcher]
background                = "#f3f1f8"
background-alpha          = 0.97
text                      = "#2e2840"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#f3f1f8"
scrim-alpha               = 0.12
selected-background       = "#7b6fb0"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#7b6fb0"
selected-border-alpha     = 0.0

[menu]
background                = "#f3f1f8"
background-alpha          = 0.97
text                      = "#2e2840"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#f3f1f8"
scrim-alpha               = 0.12
selected-background       = "#7b6fb0"
selected-background-alpha = 0.88
selected-text             = "#ffffff"
selected-border           = "#7b6fb0"
selected-border-alpha     = 0.0

[polkit]
background       = "#f3f1f8"
background-alpha = 0.94
text             = "#2e2840"
text-error       = "#d65a74"
border           = "hyprland.active-border"
border-error     = "#d65a74"
border-alpha     = 1.0
scrim            = "#f3f1f8"
scrim-alpha      = 0.25
accent           = "#7b6fb0"

[lock]
background       = "#f3f1f8"
background-alpha = 0.80
text             = "#2e2840"
placeholder      = "#6a6383"
text-error       = "#d65a74"
border           = "rgba(3d3554ff)"
border-active    = "#7b6fb0"
border-error     = "#d65a74"
border-alpha     = 1.0
selection        = "#7b6fb0"
selection-alpha  = 0.45

[image-picker]
text                    = "#2e2840"
selected-border         = "#7b6fb0"
selected-border-alpha   = 1.0
unselected-border       = "#2e2840"
unselected-border-alpha = 0.28

# Liquid Glass — thème « violet prune — vin et or » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#1c0d1a"
background-alpha = 0.85
text             = "#f4e2ee"
active           = "#e88ab8"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(e88ab8ff)"
active-border-foreground = "rgba(e88ab8ff)"

[controls]
normal-color        = "#f4e2ee"
normal-fill-alpha   = 0.05
normal-border       = "#f4e2ee"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#f4e2ee"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#f4e2ee"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#e88ab8"
focus-fill-alpha   = 0.12
focus-border       = "#e88ab8"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#e88ab8"
selected-fill-alpha   = 0.88
selected-border       = "#e88ab8"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#1c0d1a"
background-alpha = 0.92
text             = "#f4e2ee"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#1c0d1a"
background-alpha = 0.92
text             = "#f4e2ee"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1c0d1a"
background-alpha = 0.92
text             = "#f4e2ee"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#e88ab8"

[launcher]
background                = "#1c0d1a"
background-alpha          = 0.97
text                      = "#f4e2ee"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1c0d1a"
scrim-alpha               = 0.12
selected-background       = "#e88ab8"
selected-background-alpha = 0.88
selected-text             = "#1c0d1a"
selected-border           = "#e88ab8"
selected-border-alpha     = 0.0

[menu]
background                = "#1c0d1a"
background-alpha          = 0.97
text                      = "#f4e2ee"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1c0d1a"
scrim-alpha               = 0.12
selected-background       = "#e88ab8"
selected-background-alpha = 0.88
selected-text             = "#1c0d1a"
selected-border           = "#e88ab8"
selected-border-alpha     = 0.0

[polkit]
background       = "#1c0d1a"
background-alpha = 0.94
text             = "#f4e2ee"
text-error       = "#ff8fa2"
border           = "hyprland.active-border"
border-error     = "#ff8fa2"
border-alpha     = 1.0
scrim            = "#1c0d1a"
scrim-alpha      = 0.25
accent           = "#e88ab8"

[lock]
background       = "#1c0d1a"
background-alpha = 0.80
text             = "#f4e2ee"
placeholder      = "#c2a0b6"
text-error       = "#ff8fa2"
border           = "rgba(e88ab8ff)"
border-active    = "#e88ab8"
border-error     = "#ff8fa2"
border-alpha     = 1.0
selection        = "#e88ab8"
selection-alpha  = 0.45

[image-picker]
text                    = "#f4e2ee"
selected-border         = "#e88ab8"
selected-border-alpha   = 1.0
unselected-border       = "#f4e2ee"
unselected-border-alpha = 0.28

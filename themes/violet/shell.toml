# Liquid Glass — thème « violet nuit — montagnes violettes, horloge bonbon » (profil Linux). Généré par scripts/gen-linux-themes.py.

[bar]
background       = "#1a1230"
background-alpha = 0.85
text             = "#ece4ff"
active           = "#cdb6ff"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 30

[hyprland]
active-border            = "rgba(cdb6ffff)"
active-border-foreground = "rgba(cdb6ffff)"

[controls]
normal-color        = "#ece4ff"
normal-fill-alpha   = 0.05
normal-border       = "#ece4ff"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#ece4ff"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#ece4ff"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#cdb6ff"
focus-fill-alpha   = 0.12
focus-border       = "#cdb6ff"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#cdb6ff"
selected-fill-alpha   = 0.88
selected-border       = "#cdb6ff"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 16
popup-padding = 14

[font]
base-size = 12

[popups]
background       = "#1a1230"
background-alpha = 0.92
text             = "#ece4ff"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#1a1230"
background-alpha = 0.92
text             = "#ece4ff"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1a1230"
background-alpha = 0.92
text             = "#ece4ff"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#cdb6ff"

[launcher]
background                = "#1a1230"
background-alpha          = 0.97
text                      = "#ece4ff"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1a1230"
scrim-alpha               = 0.12
selected-background       = "#cdb6ff"
selected-background-alpha = 0.88
selected-text             = "#1a1230"
selected-border           = "#cdb6ff"
selected-border-alpha     = 0.0

[menu]
background                = "#1a1230"
background-alpha          = 0.97
text                      = "#ece4ff"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1a1230"
scrim-alpha               = 0.12
selected-background       = "#cdb6ff"
selected-background-alpha = 0.88
selected-text             = "#1a1230"
selected-border           = "#cdb6ff"
selected-border-alpha     = 0.0

[polkit]
background       = "#1a1230"
background-alpha = 0.94
text             = "#ece4ff"
text-error       = "#ff9bb3"
border           = "hyprland.active-border"
border-error     = "#ff9bb3"
border-alpha     = 1.0
scrim            = "#1a1230"
scrim-alpha      = 0.25
accent           = "#cdb6ff"

[lock]
background       = "#1a1230"
background-alpha = 0.80
text             = "#ece4ff"
placeholder      = "#b6a8d8"
text-error       = "#ff9bb3"
border           = "rgba(cdb6ffff)"
border-active    = "#cdb6ff"
border-error     = "#ff9bb3"
border-alpha     = 1.0
selection        = "#cdb6ff"
selection-alpha  = 0.45

[image-picker]
text                    = "#ece4ff"
selected-border         = "#cdb6ff"
selected-border-alpha   = 1.0
unselected-border       = "#ece4ff"
unselected-border-alpha = 0.28
